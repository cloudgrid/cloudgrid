        owner_boundary: split_by_contract_storage_bff_frontend
        acceptance: Rich metric creation/editing remains gated until contract, storage-read, BFF, frontend, and focused tests pass.
ai_chat_gate_simulation:
  status: pass
  planner_result: implementation_ready_for_autonomous_agents
  blockers_for_implementation: []
  global_agent_rules:
    - Agents must start at specs/spec.md and then read the AI Chat capability, flow, backend runtime, implementation contract, frontend view, GraphQL, AsyncAPI, JSON Schema, errors, product UX, and boundary specs for their ownership area.
    - Agents must keep to one ownership boundary and write only files in their assigned ticket scope.
    - Agents must not add AI Chat tools, renderer keys, action kinds, provider kinds, model aliases, stream event types, message part types, sandbox APIs, skill mounts, GraphQL fields, NATS subjects, or error codes outside the approved contracts.
    - Frontend agents must use AI Elements primitives and BFF-validated json-render artifacts; they must not implement a custom chat framework, execute artifact scripts, or expose tool payloads.
    - BFF agents must route provider execution through PURISTA harness adapters and catalog-defined tools; they must not call provider SDKs directly or read SurrealDB/NATS outside approved bridge helpers.
    - Control-plane agents own AI Chat persistence, ownership checks, idempotency, action approval state, and provider settings metadata.
  simulated_tickets:
    - id: AIC-1
      name: AI Chat contracts and catalog foundation
      owner_boundary: contracts
      read_scope: [specs/04-backend/ai-chat.md, specs/04-backend/ai-runtime-structure.md, specs/04-backend/ai-chat-implementation-contract.md, specs/03-contracts]
      write_scope: [specs/03-contracts, apps/packages/ui-contracts, apps/packages/public-api-client, apps/packages/definition, core/go-contracts, tooling contract tests]
      contract_traceability: [public-schema.graphql, http-api.openapi.yaml, message-bridge.asyncapi.yaml, ai-chat.schema.json, ai-chat-stream.schema.json, json-render-catalog.schema.json, errors.yaml]
      acceptance: Machine-readable contracts expose aligned AI Chat GraphQL, SSE, bridge, entity, renderer, action, and generated TypeScript/Go shapes with no stale field names.
      verification: ["bun run contracts:check", "bun run typecheck"]
      open_decisions: []
    - id: AIC-2
      name: Control-plane AI Chat persistence
      owner_boundary: control-plane
      read_scope: [specs/04-backend/control-plane.md, specs/04-backend/ai-chat.md, specs/03-contracts/messages/message-bridge.asyncapi.yaml]
