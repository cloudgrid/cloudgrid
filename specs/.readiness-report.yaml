      contract_traceability: [POST /api/ai-chat/stream, AiChatStream, AiChatHarnessPort, AI_CHAT_MODEL_ALIASES, AI_CHAT_TOOLS, AI_CHAT_BUDGETS]
      acceptance: BFF validates scope/idempotency, creates runs, invokes PURISTA harness workflows, streams typed SSE, enforces prompt policy, propagates telemetry, executes catalog tools only, and cleans up sandbox files.
      verification: ["bun test apps/backend/src/ai-chat-harness.test.ts apps/backend/src/ai-chat-stream.test.ts", "bun run --cwd apps/backend typecheck", "bun run contracts:check"]
      open_decisions: []
