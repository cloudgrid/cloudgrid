source: implementation-ready-completion-pass
status: implementation_ready
updated: 2026-05-24
notes:
  - Current CloudGrid specs and contracts are sufficient for MVP closure implementation.
  - Formal implementation-planner gate file specs/.readiness-report.yaml exists and records the current verification state.
  - Auth, control-plane, frontend login/company/project management, and SurrealDB tenant/project database separation have been implemented in the current codebase.
  - OTLP metrics ingest/query/persistence, OTLP gRPC ingest on 4317, project membership, project retention policy CRUD, and alert rule/silence/history CRUD are now implemented surfaces, not deferred waves.
  - Production-scale performance work now has explicit implementation constraints in specs/06-nfr/performance-and-scaling.md.
  - Remaining production gaps are specified implementation requirements, not open product-decision gaps.
  - Per-item completion status is tracked in specs/implementation-ready.md.
  - AI Eval v2 is now tracked as IR-010 with an implementation-ready migration plan and completed BFF plus storage service foundation tickets.
blocking_gaps: []
implementation_ready_status:
  IR-001:
    status: partial
    evidence:
      - SurrealDB retention adapter/query/schema/readiness groundwork exists.
      - SurrealDB retention adapter is wired into storage-maintenance startup for surrealdb builds.
      - Storage-read soft-delete filters and storage-write soft-delete fields exist.
      - go test ./core/storage-maintenance/... passes.
      - go test -tags surrealdb ./core/storage-maintenance/... passes.
    remaining:
      - Complete opt-in live SurrealDB tests for every executable data class, soft delete/final delete, dry-run mutation checks, and lease contention/reacquire.
  IR-002:
    status: complete
    evidence:
      - control.projects.list_for_service exists.
      - Alert evaluator project discovery and startup source validation exist.
      - Webhook/email notification dispatch adapters and catalog validation exist.
      - Typed alert dashboard widget contracts exist for alert_status, alert_history, and alert_evidence.
      - Query.alertSummary(projectId, input), public API operation metadata, and integration scenario coverage exist.
      - Dashboard UI can render alert status, history, and evidence widgets from backend view models.
      - bun run contracts:check passes.
      - bun run typecheck passes.
      - Targeted BFF/frontend alert tests pass.
      - go test -tags surrealdb ./core/control-plane/... ./core/alert-evaluator/... passes.
  IR-003:
    status: complete
    evidence:
      - Collector local/deployed bearer routing and sanitized auth failures already exist.
      - Control-plane final-admin safeguards already exist.
      - Storage-read fails closed for SSO read/live scopes and tenant mismatch.
      - Storage-write rejects deployed ingest commands without collector-authorized tenant/company/project routing.
      - BFF GraphQL HTTP, GraphQL WebSocket, and protected app shell routes have deployed-mode acceptance coverage.
      - bun test apps/backend/src/static.test.ts apps/backend/src/auth.test.ts apps/backend/src/graphql-ws.test.ts passes.
      - go test -tags surrealdb ./core/otlp-collector/... ./core/storage-read/... ./core/storage-write/... ./core/control-plane/... passes.
  IR-004:
    status: blocked-by-environment
    evidence:
      - Benchmark scripts and production sizing/release docs exist.
      - Production benchmark JSON includes deployment profile, environment identity, image tag, thresholds, observed values, and pass/fail status.
      - bun test tooling/scripts/bench.test.mjs passes.
    remaining:
      - Run production benchmark commands against the exact promoted deployment and persist JSON evidence.
  IR-005:
    status: complete
    evidence:
      - AI provider and AI Chat generated metadata, BFF bridge/resolvers, validation, integration scenario coverage, and contract checks are present.
      - bun run contracts:check passes.
  IR-006:
    status: partial
    evidence:
      - AI Chat route, navigation, history/conversation reads, safe artifact preview, server-issued action approval UI, tests, and handbook docs exist.
      - BFF SSE stream endpoint, ordered terminal stream events, abort cleanup, and public API stream client helper exist.
      - Machine-readable durable run-state contracts exist for control.ai_chat.run.create, control.ai_chat.run.update, and control.ai_chat.run.finalize.
      - Control-plane persists AI Chat run lifecycle and enforces idempotency/active-run rejection.
      - Follow-up prompt streaming UI uses the public API client.
      - bun run contracts:check passes.
      - bun run typecheck passes.
      - bun run --cwd apps/frontend test passes.
      - go test -tags surrealdb ./core/control-plane/... passes.
    remaining:
      - Complete AI Elements/json-render component integration and richer company/project provider settings forms.
  IR-007:
    status: complete
    evidence:
      - No dedicated core/log-ingest service is specified for this wave.
      - Collector POST /v1/logs compatibility and telemetry.ingest.logs semantics are preserved.
  IR-008:
    status: complete
    evidence:
      - Website handbook covers Helm install, external dependencies, image customization, private registry/air-gapped installs, release verification, upgrade/rollback, and sizing.
      - bun run --cwd website build passes.
  IR-009:
    status: partial
    evidence:
      - Shared Go OTLP trace/log exporter supports per-signal toggles, bounded sanitized log records, trace/span IDs, severity numbers, observed timestamps, log scope naming, dropped-buffer metrics, and rate-limited exporter failure warnings.
      - AI-eval runner wires exporter startup, NATS handler spans/failure logs, and shutdown flush.
      - go test -tags surrealdb ./core/go-runtime/... ./core/otlp-collector/... ./core/control-plane/... ./core/storage-read/... ./core/storage-write/... ./core/ai-eval-runner/... passes.
    remaining:
      - Complete full-service log event coverage evidence across BFF, collector, control-plane, storage-read, storage-write, and AI-eval runner.
      - Complete normal Logs UI inspection evidence for the self-observability project.
  IR-010:
    status: partial
    evidence:
      - AI Eval v2 product, backend, frontend, NFR, GraphQL, AsyncAPI, entity schema, generated TypeScript, and generated Go contracts are aligned.
      - BFF v2 bridge validation and resolver foundation is complete in TICKET-201.
      - Storage-write AI Eval v2 persistence is complete in TICKET-202.
      - Storage-read AI Eval v2 query semantics are complete in TICKET-203.
      - AI Eval runner v2 evaluation orchestration is complete in TICKET-204.
      - Frontend AI Eval v2 workspace is complete in TICKET-205.
      - TICKET-206 integration fixtures, docs, and runtime v2 dataset shape normalization are complete enough to unblock final verification.
      - bun run contracts:check passes.
      - bun run typecheck passes.
      - go test -tags surrealdb ./core/storage-read/... ./core/storage-write/... passes.
      - spec check, plan lint, and wave readiness checks pass.
    remaining:
      - Complete TICKET-206 final Go workspace verification in an environment with Go available.
      - Complete TICKET-206 browser/API end-to-end acceptance in an environment with browser automation available.
implemented_surfaces:
  - metrics ingest, storage-write persistence, storage-read metric names/series/rich-series query, BFF GraphQL resolvers, and frontend metric explorer/dashboard widget surfaces
  - grpc otlp ingest on standard port 4317 for traces, logs, and metrics
  - project membership contracts, control-plane storage/service/NATS handlers, BFF GraphQL bridge, and project settings UI
  - project-level retention policy contracts, control-plane storage/service/NATS handlers, BFF GraphQL bridge, and project settings UI
  - project-scoped alert rule, alert silence, and alert history contracts plus control-plane storage/service/NATS handlers, BFF GraphQL bridge, and alert management UI
  - organization invitations and invitation email delivery contracts/control-plane/BFF/frontend/docs
  - live trace subscriptions through BFF GraphQL, storage-read live sessions, and storage-write post-persist notifications
  - AI Eval v2 contracts, BFF bridge validation/resolver foundation, storage service persistence/query semantics, and implementation-ready migration plan
explicit_deferrals:
  - production-scale backpressure and benchmark implementation
  - storage-maintenance retention deletion worker and retention audit execution
  - alert evaluator scheduling, rule execution, state transitions, and notification dispatch adapters
  - production deployment manifests
  - production multi-tenant auth hardening beyond local/default project isolation
  - project/company AI provider settings and AI Chat are now specified as a
    draft follow-on wave; implementation starts only after GraphQL, AsyncAPI,
    generated contracts, and a readiness report are approved for that wave
