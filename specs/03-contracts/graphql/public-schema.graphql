"""
Public GraphQL contract exposed only by the TypeScript BFF.
Resolvers must call NATS request/reply subjects and must not import SurrealDB clients or Go storage adapters.
Aggregate, facet, correlation, trace-structure, and span-enrichment fields are authoritative backend-derived view models.
"""

scalar DateTime
scalar JSON

type Query {
  viewer: Viewer
  organizations: [Organization!]!
  organization(id: ID!): Organization
  organizationMembers(organizationId: ID!): [OrganizationMember!]!
  organizationInvitations(organizationId: ID!): [OrganizationInvitation!]!
  projects(input: ProjectListInput = {}): [Project!]!
  project(id: ID!): Project
  projectMembers(projectId: ID!): [ProjectMember!]!
  traces(input: TraceSearchInput = {}): TraceSearchResult!
  trace(id: ID!, input: TraceDetailInput = {}): TraceDetail
  logs(input: LogSearchInput = {}): LogSearchResult!
  telemetryFacets(input: TelemetryFacetInput = {}): TelemetryFacetResult!
  ingestCredentials(projectId: ID!): IngestCredentialListResult!
  metricNames(input: MetricNameSearchInput = {}): MetricNameSearchResult!
  metricSeries(input: MetricSeriesInput!): MetricSeriesResult!
  richMetricSeries(input: RichMetricSeriesInput!): RichMetricSeriesResult!
  dashboards(input: DashboardListInput = {}): DashboardListResult!
  retentionPolicy(projectId: ID!): RetentionPolicy!
  alertRules(projectId: ID!, input: AlertRuleSearchInput): [AlertRule!]!
  alertHistory(projectId: ID!, ruleId: ID, first: Int = 50, after: String): AlertEventConnection!
  alertSummary(projectId: ID!, input: AlertSummaryInput = {}): AlertSummary!
  alertSilences(projectId: ID!, ruleId: ID): [AlertSilence!]!
  agentRuns(input: AgentRunSearchInput = {}): AgentRunSearchResult!
  agentRun(id: ID!): AgentRun
  datasets(input: DatasetSearchInput = {}): DatasetSearchResult!
  dataset(id: ID!): Dataset
  datasetVersion(id: ID!): DatasetVersion
  datasetCandidates(input: DatasetCandidateSearchInput = {}): DatasetCandidateSearchResult!
  datasetImport(id: ID!): DatasetImportJob
  datasetExport(id: ID!): DatasetExportJob
  evaluationDefinitions(input: EvaluationDefinitionSearchInput = {}): EvaluationDefinitionSearchResult!
  evaluationDefinition(id: ID!): EvaluationDefinition
  evaluationRuns(input: EvaluationRunSearchInput = {}): EvaluationRunSearchResult!
  evaluationRun(id: ID!): EvaluationRun
  evaluationResults(input: EvaluationResultsSearchInput = {}): MetricResultSearchResult!
  evaluationComparisons(input: EvaluationComparisonSearchInput = {}): EvaluationComparisonSearchResult!
  evaluationComparison(id: ID!): EvaluationComparison
  optimizationRuns(input: OptimizationRunSearchInput = {}): OptimizationRunSearchResult!
  optimizationRun(id: ID!): OptimizationRun
  targetSnapshot(id: ID!): TargetSnapshot
  targetDiff(input: TargetDiffInput!): TargetDiff!
  annotationQueue(input: AnnotationQueueSearchInput = {}): AnnotationQueueResult!
  projectAiSettings(projectId: ID!): ProjectAiSettings!
  projectAiProviderSettings(projectId: ID!): ProjectAiProviderSettings!
  companyAiProviderSettings(companyId: ID!): CompanyAiProviderSettings!
  aiChatHistory(input: AiChatHistoryInput!): AiChatHistory!
  aiChatConversation(id: ID!): AiChatConversation
  aiQualityOverview(input: AiQualityOverviewInput!): AiQualityOverview!
}

type Mutation {
  selectProject(projectId: ID!): Viewer!
  createProject(input: CreateProjectInput!): Project!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  inviteOrganizationMember(input: InviteOrganizationMemberInput!): OrganizationInvitation!
  inviteProjectMember(input: InviteProjectMemberInput!): ProjectInvitationResult!
  resendOrganizationInvitation(id: ID!): OrganizationInvitation!
  revokeOrganizationInvitation(id: ID!): OrganizationInvitation!
  updateOrganizationMember(input: UpdateOrganizationMemberInput!): OrganizationMember!
  removeOrganizationMember(input: RemoveOrganizationMemberInput!): Boolean!
  updateProjectMember(projectId: ID!, userId: ID!, role: ProjectRole!): ProjectMember!
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!
  createIngestCredential(input: CreateIngestCredentialInput!): CreatedIngestCredential!
  revokeIngestCredential(id: ID!): IngestCredential!
  saveDashboard(input: SaveDashboardInput!): Dashboard!
  deleteDashboard(id: ID!): Boolean!
  setDashboardPinned(input: SetDashboardPinnedInput!): DashboardPreferences!
  reorderDashboardPins(input: ReorderDashboardPinsInput!): DashboardPreferences!
  updateRetentionPolicy(input: UpdateRetentionPolicyInput!): RetentionPolicy!
  createAlertRule(input: CreateAlertRuleInput!): AlertRule!
  updateAlertRule(input: UpdateAlertRuleInput!): AlertRule!
  deleteAlertRule(id: ID!): Boolean!
  createAlertSilence(input: CreateAlertSilenceInput!): AlertSilence!
  deleteAlertSilence(id: ID!): Boolean!
  createDataset(input: CreateDatasetInput!): Dataset!
  updateDatasetSettings(input: UpdateDatasetSettingsInput!): Dataset!
  appendDatasetItems(input: AppendDatasetItemsInput!): Dataset!
  updateDatasetItems(input: UpdateDatasetItemsInput!): Dataset!
  promoteSpanToDatasetItem(input: PromoteSpanToDatasetItemInput!): DatasetItem!
  prepareDatasetCandidates(input: PrepareDatasetCandidatesInput!): DatasetCandidateSearchResult!
  commitDatasetCandidates(input: CommitDatasetCandidatesInput!): Dataset!
  prepareDatasetImport(input: PrepareDatasetImportInput!): DatasetImportJob!
  commitDatasetImport(input: CommitDatasetImportInput!): DatasetImportJob!
  startDatasetExport(input: StartDatasetExportInput!): DatasetExportJob!
  createEvaluationDefinition(input: CreateEvaluationDefinitionInput!): EvaluationDefinition!
  updateEvaluationDefinition(input: UpdateEvaluationDefinitionInput!): EvaluationDefinition!
  startEvaluationRun(input: StartEvaluationRunInput!): EvaluationRun!
  pauseEvaluationRun(input: EvaluationRunControlInput!): EvaluationRun!
  resumeEvaluationRun(input: EvaluationRunControlInput!): EvaluationRun!
  cancelEvaluationRun(input: EvaluationRunControlInput!): EvaluationRun!
  createEvaluationComparison(input: CreateEvaluationComparisonInput!): EvaluationComparison!
  startOptimizationRun(input: StartOptimizationRunInput!): OptimizationRun!
  promoteTargetSnapshot(input: PromoteTargetSnapshotInput!): PromotionRecord!
  resolveAnnotation(input: ResolveAnnotationInput!): AnnotationQueueItem!
  updateProjectAiSettings(input: UpdateProjectAiSettingsInput!): ProjectAiSettings!
  updateProjectAiProviderSettings(input: UpdateProjectAiProviderSettingsInput!): ProjectAiProviderSettings!
  updateCompanyAiProviderSettings(input: UpdateCompanyAiProviderSettingsInput!): CompanyAiProviderSettings!
  createAiChatConversation(input: CreateAiChatConversationInput!): AiChatConversation!
  archiveAiChatConversation(id: ID!): AiChatConversation!
  deleteAiChatConversation(id: ID!): Boolean!
  approveAiChatAction(input: ApproveAiChatActionInput!): AiChatActionProposal!
}

type Subscription {
  liveTraces(input: LiveTraceInput = {}): LiveTraceEvent!
  liveEvaluationRun(input: LiveEvaluationRunInput!): EvaluationRunEvent!
}

