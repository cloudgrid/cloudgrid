x-cloudgrid:
  timeout_ms:
    read_request_reply: 6000
    write_publish_ack: 1000
  write_stream:
    name: TELEMETRY_INGEST
    subjects:
      - telemetry.ingest.traces
      - telemetry.ingest.logs
      - telemetry.ingest.metrics
    retention: limits
    storage: file
    max_age: P7D
  consumers:
    storage_write:
      durable: storage-write
      ack_policy: explicit
      ack_wait: PT30S
      max_deliver: 5
  volatile_notifications:
    telemetry.persisted.traces:
      channel: telemetry.persisted.traces
      publisher: storage-write
      subscriber: storage-read
      purpose: Wake currently registered live trace subscriptions after trace persistence commits.
      retention: none
      delivery_semantics: at-most-once
      payload_limit: Trace IDs, persisted timestamp, and non-sensitive routing hints only.
  live_trace_delivery:
    public_api: GraphQL Subscription.liveTraces
    bff_start_subject: telemetry.traces.live.start
    bff_stop_subject: telemetry.traces.live.stop
    storage_read_event_subject_pattern: telemetry.traces.live.events.<bffInstanceId>.<subscriptionId>
    bff_must_not_subscribe_subjects: [TELEMETRY_INGEST, telemetry.persisted.traces]
    storage_read_role: authorize_filter_match_and_emit_trace_events
    storage_write_role: publish_trace_ids_after_successful_persist
    heartbeat_interval_ms: 15000
    default_buffer_limit: 100
    max_buffer_limit: 500
  error_mapping:
    bridge_error_source: specs/03-contracts/errors.yaml
    public_problem_details: RFC9457
    public_problem_extensions: [id, code, retryable, details]
    graphql_extension_path: extensions.problem
  validation:
    bff_runtime: zod
    frontend_graphql_response: zod
    go_runtime: typed_contracts
    drift_check:
      parse_graphql_sdl: true
      validate_asyncapi_channels: true
      validate_asyncapi_operations: true
      validate_asyncapi_message_refs: true
      validate_entity_schema_refs: true
      validate_error_taxonomy_refs: true
  telemetry_read_semantics:
    owner: core/storage-read
    bff_role: validate_map_request_reply_and_graphql_subscription_transport
    frontend_role: render_graphql_view_models
    database_pushdown:
      required_for: [filters, cursor_predicates, sort_order, counts, grouping, bounded_facets]
      spec: specs/04-backend/telemetry-query-semantics.md
  contract_generation:
    target_state: generated
    source_package: apps/packages/definition
    generated_outputs:
      - specs/03-contracts/messages/message-bridge.asyncapi.yaml
