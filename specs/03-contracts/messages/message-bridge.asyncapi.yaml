        $ref: "#/components/schemas/AlertEvaluatorGenericResponse"
    AlertNotificationDispatchRequest:
      name: AlertNotificationDispatchRequest
      payload:
        $ref: "#/components/schemas/AlertNotificationDispatchRequest"
    AlertNotificationDispatchResponse:
      name: AlertNotificationDispatchResponse
      payload:
        $ref: "#/components/schemas/AlertEvaluatorGenericResponse"
  schemas:
    BridgeEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, issuedAt]
      properties:
        requestId:
          type: string
        issuedAt:
          type: string
          format: date-time
        traceContext:
          type: object
          description: Deprecated compatibility metadata. New implementations propagate W3C Trace Context in NATS headers `traceparent` and `tracestate`; consumers must not require this payload field for parent-child tracing.
          additionalProperties: true
        authContext:
          $ref: "#/components/schemas/AuthContext"
    AuthContext:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [anonymous, authenticated, service]
        authMode:
          type: string
          enum: [local, sso]
          description: Runtime auth mode that produced this normalized context.
        principalId:
          type: string
          description: Validated JWT subject or service principal. Never copied from user input.
        principalDisplayName:
          type: string
          description: Provider-normalized browser user display name resolved by the trusted public auth boundary.
        principalEmail:
          type: string
          description: Provider-normalized browser user email resolved by the trusted public auth boundary.
        principalEmailVerified:
          type: boolean
          description: True only when the trusted auth boundary verified that the provider asserted the principal email as verified.
        tenantId:
          type: string
          description: Trusted tenant ID resolved by control-plane or local mode.
        companyId:
          type: string
          description: Trusted company ID resolved by control-plane or local mode.
        projectId:
          type: string
          description: Trusted project ID resolved by control-plane or local mode.
        scopes:
          type: array
          items:
            type: string
            enum: ["telemetry:read", "telemetry:live", "telemetry:ingest:traces", "telemetry:ingest:logs", "telemetry:ingest:metrics"]
        ingestAllowed:
          type: boolean
          description: Ingestion authorization decision set by the public ingestion boundary.
        readAllowed:
          type: boolean
          description: Read authorization decision set by the BFF before calling storage-read.
        checkedAt:
          type: string
          format: date-time
          description: UTC time when the public boundary normalized this context.
    BridgeError:
      type: object
      additionalProperties: false
      required: [id, code, message, retryable]
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    AiProjectionKind:
      type: string
      enum: [agent_run, llm_call, tool_call, retrieval_event]
    PersistAiProjectionCommand:
      allOf:
        - $ref: "#/components/schemas/BridgeEnvelope"
        - type: object
          additionalProperties: false
          required: [commandId, traceId, spanId, kind, projection]
          properties:
            commandId:
              type: string
            traceId:
              type: string
            spanId:
              type: string
            kind:
              $ref: "#/components/schemas/AiProjectionKind"
            projection:
              type: object
              additionalProperties: true
              description: Canonical AI projection fields with source span pointers and no copied prompt/completion content.
            sourceFlavor:
              type: string
              enum: [gen_ai, openinference, both, neither]
            normalizationWarnings:
              type: array
              items:
                type: string
    AiProjectionPersistedNotification:
      type: object
      additionalProperties: false
      required: [requestId, traceId, projectionIds, kinds, persistedAt]
      properties:
        requestId:
          type: string
        tenantId:
          type: string
        projectId:
          type: string
        traceId:
          type: string
        projectionIds:
          type: array
          items:
            type: string
        spanIds:
          type: array
          items:
            type: string
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/AiProjectionKind"
        persistedAt:
          type: string
          format: date-time
    EvalQueryRequest:
      allOf:
