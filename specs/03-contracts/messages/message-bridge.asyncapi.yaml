      properties:
        requestId:
          type: string
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/BridgeError"
    EvalMutationRequest:
      allOf:
        - $ref: "#/components/schemas/BridgeEnvelope"
        - type: object
          additionalProperties: false
          required: [input]
          properties:
            input:
              type: object
              additionalProperties: true
    EvalMutationResponse:
      type: object
      additionalProperties: false
      required: [requestId, ok]
      properties:
        requestId:
          type: string
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/BridgeError"
    ExperimentStartRequest:
      allOf:
        - $ref: "#/components/schemas/BridgeEnvelope"
