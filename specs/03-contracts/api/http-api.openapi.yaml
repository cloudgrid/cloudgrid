openapi: 3.1.0
info:
  title: Cloudgrid HTTP API
  version: 1.0.0
  description: HTTP endpoints exposed by public and ingress services. Telemetry reads are exposed through GraphQL, not REST.
servers:
  - url: http://localhost:3000
    description: TypeScript BFF
  - url: http://localhost:4318
    description: Go OTLP collector
paths:
  /api/health:
    get:
      operationId: OPR-API-get-api-health
      summary: Get TypeScript BFF health
      responses:
        "200":
          description: BFF is healthy or degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: BFF dependency readiness is degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /livez:
    get:
      operationId: OPR-API-get-livez
      summary: Get service liveness
      responses:
        "200":
          description: Service process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      operationId: OPR-API-get-readyz
      summary: Get service readiness
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service dependencies are not ready or shutdown is draining.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    get:
      operationId: OPR-AUTH-get-login
      summary: Start BFF-managed OIDC login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
          description: Relative frontend path to return to after login.
      responses:
        "302":
          description: Redirects to the configured OIDC authorization endpoint.
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/callback:
    get:
      operationId: OPR-AUTH-get-callback
      summary: Complete BFF-managed OIDC login
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Sets the CloudGrid session cookie and redirects to the frontend return path.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: OPR-AUTH-post-logout
      summary: Clear BFF browser session
      responses:
        "204":
          description: Session cookie cleared.
        "500":
          $ref: "#/components/responses/Error"
  /api/ai-eval/dataset-imports/uploads:
    post:
      operationId: OPR-AIE-post-dataset-import-upload
      summary: Stage a dataset import file for later GraphQL-driven preview and commit.
      description: >
        BFF-owned binary transfer endpoint for dataset import staging only. It
        does not create dataset items, infer mappings, compute dataset health,
        or expose a public REST AI-eval workflow. Dataset semantics continue
        through GraphQL and private message bridge subjects.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, file]
              properties:
                projectId:
                  type: string
                file:
                  type: string
                  format: binary
                filename:
                  type: string
      responses:
        "200":
          description: File staged for import preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetImportUploadResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/ai-eval/dataset-exports/{exportId}/download:
    get:
      operationId: OPR-AIE-get-dataset-export-download
      summary: Download a prepared dataset export artifact.
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export artifact bytes.
          content:
            application/jsonl:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /api/ai-chat/runs:
    post:
      operationId: OPR-AIC-post-chat-run
      summary: Start an AI Chat run and stream server-sent events.
      description: >
        BFF-owned SSE endpoint for AI Chat only. The endpoint starts or resumes a
        chat run through the integrated AI harness, persists messages and action
        proposals through control-plane bridge subjects, and streams typed events
        to the browser. Telemetry data access continues through GraphQL and
        private storage-read subjects; this endpoint must not expose REST
        telemetry reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRunRequest"
      responses:
        "200":
          description: Server-sent event stream for the chat run.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/traces:
    post:
      operationId: OPR-OTLP-post-v1-traces
      summary: Ingest OTLP traces through the Go collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Trace payload is published to the message bridge. Response body is the OTLP ExportTraceServiceResponse using the same encoding as the request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/logs:
    post:
      operationId: OPR-OTLP-post-v1-logs
      summary: Ingest OTLP logs through the Go collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Log payload is published to the message bridge. Response body is the OTLP ExportLogsServiceResponse using the same encoding as the request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/metrics:
    post:
      operationId: OPR-OTLP-post-v1-metrics
      summary: Ingest OTLP metrics through the Go collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-protobuf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Metric payload is published to the message bridge. Response body is the OTLP ExportMetricsServiceResponse using the same encoding as the request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Canonical API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ProblemDetails"
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, id, code, retryable]
      properties:
        type:
          type: string
          format: uri-reference
          description: RFC 9457 problem type URI.
        title:
          type: string
          description: Short stable summary for the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status associated with this problem.
        detail:
          type: string
          description: Human-readable problem detail safe for clients.
        instance:
          type: string
          description: Optional occurrence-specific problem URI.
        id:
          type: string
          description: Error ID from errors.yaml.
        code:
          type: string
          description: Stable machine-readable error code.
        retryable:
          type: boolean
          description: Whether retry can succeed under the retry preconditions.
        details:
          type: object
          additionalProperties: true
    DatasetImportUploadResponse:
      type: object
      additionalProperties: false
      required: [uploadId, projectId, filename, sizeBytes, sha256, expiresAt]
      properties:
        uploadId:
          type: string
        projectId:
          type: string
        filename:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
        detectedFormat:
          type: string
          enum: [jsonl, json_array, csv, zip]
        containedFiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, sizeBytes, detectedFormat]
            properties:
              path:
                type: string
              sizeBytes:
                type: integer
                minimum: 0
              detectedFormat:
                type: string
                enum: [jsonl, json_array, csv, unsupported]
        expiresAt:
          type: string
          format: date-time
    AiChatRunRequest:
      type: object
      additionalProperties: false
      required: [companyId, projectId, conversationId, message]
      properties:
        companyId:
          type: string
        projectId:
          type: string
        conversationId:
          type: string
        message:
          type: string
        idempotencyKey:
          type: string
        resumeRunId:
          type: string
    AiChatStreamEvent:
      type: object
      additionalProperties: false
      required: [type, runId, seq, emittedAt]
      properties:
        type:
          type: string
          enum:
            - run.started
            - message.delta
            - message.completed
            - artifact.created
            - action.proposed
            - action.updated
            - run.completed
            - run.failed
            - heartbeat
        runId:
          type: string
        conversationId:
          type: string
        seq:
          type: integer
          minimum: 0
        emittedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          $ref: "#/components/schemas/ErrorResponse"
