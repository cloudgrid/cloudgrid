{{- if .Values.surrealdb.bundled.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudgrid.surrealdbSecretName" . }}
  labels:
    {{- include "cloudgrid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.surrealdb.external.usernameKey }}: {{ required "surrealdb.bundled.username is required when bundled SurrealDB is enabled" .Values.surrealdb.bundled.username | quote }}
  {{ .Values.surrealdb.external.passwordKey }}: {{ required "surrealdb.bundled.password is required when bundled SurrealDB is enabled" .Values.surrealdb.bundled.password | quote }}
{{- end }}
